packages:
  - packages/core
  - packages/examples/*

autoInstallPeers: false

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  better-sqlite3: true
  esbuild: true
  prisma: true

overrides:
  vite: npm:@voidzero-dev/vite-plus-core@latest

peerDependencyRules:
  allowAny:
    - vite
  ignoreMissing:
    - react
    - react-dom
