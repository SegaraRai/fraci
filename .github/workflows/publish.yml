name: Publish

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: ".node-version"
          cache: true

      - name: Install Dependencies
        run: vp install --frozen-lockfile

      - name: Check Formatting, Lint, and Types
        run: vp run check

      - name: Build
        run: vp run build

      - name: Type Check
        run: vp run typecheck

      - name: Test
        run: vp run test

      - name: Run Benchmarks
        run: vp run bench

      - name: Package Type Check
        run: vp run attw

      - name: Build Docs
        run: vp run build:docs

      - name: Build Examples
        run: vp run build:examples

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: vp run changeset:version
          publish: vp run changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Create Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/core/typedoc/

  deploy-pages:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
